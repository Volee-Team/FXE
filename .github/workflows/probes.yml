name: probes

# Every push and every pull request. The whole point is that a change which
# breaks a rule Tara relies on fails here, not in front of her.
# `push:` with no branch filter, deliberately. It used to be
# `branches: [main]`, which meant CI never ran on the feature branches this
# project's own SessionStart hook tells every session to create. Work happened
# on a branch, CI watched main, and the two never met. (2026-08-13)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sql-probes:
    name: SQL probes + concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned to the SAME version as the laptop (2.115.0), which is the
      # whole point. This job was red for days while local was green, because
      # local was pinned to 2.90.0 and CI installed `latest`. The skew was not
      # a nuisance; it was actively hiding a real bug: the newer Supabase stack
      # stopped handing `anon`/`authenticated` a blanket table grant, and this
      # schema had never written down the SELECT the app depends on. CI was
      # correct and unheard for three days.
      #
      # Bump this and the laptop together, in one commit, after the suite is
      # green locally on the new version. Never let the two drift again.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      # Printed, not assumed. When this job goes red, the first question is
      # always "what changed underneath us", and a version in the log answers it
      # in seconds. Hard rule 12: a claim about the environment comes with the
      # command that produced it.
      - name: Record the environment
        run: |
          echo "supabase CLI: $(supabase --version 2>&1 | head -1)"
          echo "docker:       $(docker --version)"
          echo "runner:       $(uname -a)"
          echo "date (UTC):   $(date -u)"

      # Output is NOT suppressed. This step failing used to produce a red job
      # with no explanation, because the only diagnostic step ran `supabase logs
      # db` against a stack that had never come up.
      - name: Start local Postgres stack
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Show container state
        if: always()
        run: docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'

      # `db reset` applies every migration in order and then the seed. If a
      # migration is broken, or the seed no longer satisfies a new constraint,
      # this is where it surfaces.
      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run probe suite
        run: bash tests/run-probes.sh

      # Every table, view, enum, client RPC, probe, edge function, CI job and
      # Swift file must be named in docs/architecture.md (2026-09-13). Needs
      # the database, which is why it lives here and not in doc-paths.
      - name: Architecture doc names every object that exists
        run: bash scripts/check-doc-inventory.sh

      # Diagnostics on failure. Each falls back rather than short-circuiting,
      # because the most useful case is the one where the stack never started
      # and `supabase logs` itself cannot run.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "===== containers ====="
          docker ps -a || true
          echo "===== raw db container logs ====="
          docker logs "$(docker ps -aqf name=supabase_db)" 2>&1 | tail -100 || true
          echo "===== migrations present ====="
          ls -1 supabase/migrations/ || true

  web-browser-tests:
    name: Web admin browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Same pinned CLI and the same reset as the probes job: the browser
      # tests are Tara's side of the web admin walked against a fresh seed.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Start local stack (with auth, which the page signs in through)
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Reset to the seed
        run: supabase db reset

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test

      - name: Keep traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore

  stripe-pipeline:
    name: Stripe pipeline (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      # Edge runtime stays ON here: the three Stripe functions are the thing
      # under test. Everything else optional is off, as in the other jobs.
      - name: Start local stack (auth, rest, edge runtime)
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: Reset to the seed
        run: supabase db reset

      # Stripe's official mock server, on the same docker network as the
      # edge runtime so the functions reach it as http://stripe-mock:12111.
      - name: Start stripe-mock
        run: |
          docker run -d --name stripe-mock --network supabase_network_FXE-Tennis -p 12111:12111 stripe/stripe-mock:latest
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:12111/ && break || sleep 2
          done
          curl -s -o /dev/null -w "stripe-mock answers with http %{http_code}\n" http://127.0.0.1:12111/v1/customers -H "Authorization: Bearer sk_test_ci"

      - name: Serve the edge functions against the mock
        run: |
          bash tests/stripe/make-env.sh stripe-mock > mock.env
          nohup supabase functions serve --env-file mock.env > functions.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X POST http://127.0.0.1:54321/functions/v1/stripe-webhook && break || sleep 2
          done

      - name: Run the pipeline harness
        run: bash tests/stripe/run.sh

      - name: Function logs on failure
        if: failure()
        run: |
          tail -100 functions.log || true
          docker logs --tail 100 supabase_edge_runtime_FXE-Tennis || true
          docker logs --tail 30 stripe-mock || true

  # Push delivery (decision 0008), against a mock of APNs: the provider-token
  # signature, the headers, the verbatim body, token pruning, idempotency, the
  # audit columns a player cannot read, and the trigger -> pg_net -> function
  # path with nobody calling the function by hand. Apple's own acceptance of
  # the key is the one thing this cannot prove.
  push-pipeline:
    name: Push pipeline (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local stack (auth, rest, edge runtime)
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: Reset to the seed
        run: supabase db reset

      # The mock runs on the runner, not in a container. On Linux the edge
      # runtime reaches the host at the docker network's gateway address;
      # host.docker.internal is a Docker Desktop name and may not resolve.
      - name: Generate the env and start the mock APNs
        run: |
          GW=$(docker network inspect supabase_network_FXE-Tennis -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "docker gateway: $GW"
          bash tests/push/make-env.sh "http://$GW:12222" > push.env
          nohup deno run --allow-net --allow-read --allow-write tests/push/mock-apns.ts push.env mock-apns.json 12222 > mock-apns.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:12222/ && break || sleep 1
          done
          curl -s -o /dev/null -w "mock APNs answers with http %{http_code}\n" http://127.0.0.1:12222/

      - name: Serve the edge functions against the mock
        run: |
          nohup supabase functions serve --env-file push.env > functions.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/push)
            [ "$code" = "401" ] && break || sleep 2
          done

      - name: Run the push harness
        run: bash tests/push/run.sh push.env mock-apns.json

      - name: Logs on failure
        if: failure()
        run: |
          tail -100 functions.log || true
          docker logs --tail 100 supabase_edge_runtime_FXE-Tennis || true
          tail -50 mock-apns.log || true
          cat mock-apns.json || true

  # The app itself. Until 2026-08-13 CI never compiled a line of Swift, which
  # is exactly how a test target with zero sources survived for days while the
  # suite reported green: nothing here ever tried to run it.
  # macOS minutes cost 10x. On a pull request the job runs only when something
  # under FXETennis*/ or the project definition changed; on a push event it
  # runs on every branch (the gate below says so), so every branch's history is
  # a full record. A skipped job satisfies the required check on main.
  # (Comment moved here 2026-09-12; it had sat above the browser-tests job.)
  ios-changes:
    name: Did Swift change?
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(FXETennis|FXETennisTests|FXETennisUITests)/|^project\.yml$|^\.github/workflows/probes\.yml$'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  ios-build-and-test:
    name: Build iOS app + unit tests
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The .xcodeproj is gitignored and regenerated, so a fresh clone has no
      # project until this runs. That also makes this step the guard on the
      # fresh-clone path: if xcodegen breaks, CI finds out before a human does.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # A fixed device name is a coin flip: the macos-15 image ships with a
      # different simulator set from run to run, and on 2026-09-01 "iPhone 17
      # Pro" simply was not there ("Unable to find a device matching the
      # provided destination specifier"). Pick whatever iPhone exists.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) for x in d[k] if "iPhone" in x["name"]))')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build (Debug)
        run: |
          xcodebuild -project FXETennis.xcodeproj -scheme FXETennis \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -quiet build

      - name: Unit tests
        run: |
          xcodebuild -project FXETennis.xcodeproj -scheme FXETennis \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:FXETennisTests test

      # Release is what TestFlight ships, and it points at the hosted project
      # rather than localhost. It has broken independently of Debug before.
      - name: Build (Release, simulator SDK)
        run: |
          xcodebuild -project FXETennis.xcodeproj -scheme FXETennis \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath /tmp/dd -quiet build

      # The missing app icon is an upload-time validation failure (ITMS-90713),
      # which means you discover it after archiving rather than after building.
      # Catch it here instead.
      - name: Fail if the app icon is missing
        run: |
          PLIST=/tmp/dd/Build/Products/Release-iphonesimulator/FXETennis.app/Info.plist
          if ! plutil -p "$PLIST" | grep -q CFBundleIconName; then
            echo "::error::No CFBundleIconName in the built Info.plist."
            echo "The AppIcon asset is empty, so App Store Connect will reject"
            echo "the upload with ITMS-90713 before TestFlight ever sees it."
            exit 1
          fi
          echo "App icon present."

  # New player-facing prose must never arrive silently. Alex, 2026-08-16:
  # "text should either come straight from tara or made by u and checked by me
  # first", after finding AI filler like "Press play - Start Hitting!" in an
  # app a real club will use. docs/copy-approved.txt is the snapshot; this job
  # is the gate.
  # Every repo path a doc names must exist. The 2026-09-12 docs audit found 19
  # references to 15 files that had been renamed or never existed, one of them
  # in an agent definition that told the model to read a folder that is not
  # there. Cheapest rot to detect, most expensive to obey.
  # The 13 XCUITests walk the app the way a member and Tara do. The macOS
  # runner has no Docker, so it cannot host the local stack; instead the Debug
  # app is pointed at a throwaway hosted project (never production: CLAUDE.md,
  # "no test fixtures in hosted") that this job resets to the seed first.
  # Until that project exists (it needs a paid slot or another owner: see
  # docs/launch-checklist.md §F) the secrets are unset and every step below
  # the check is skipped, so the job stays green and says why.
  ios-ui-tests:
    name: iOS UI tests on a CI project
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    # One project, one seed: two PRs resetting it at once would corrupt each
    # other's run. Queue, never cancel.
    concurrency:
      group: fxe-ci-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        name: Is the CI project configured?
        env:
          DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
          ANON: ${{ secrets.CI_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$ANON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_SUPABASE_DB_URL / CI_SUPABASE_ANON_KEY are not set; the XCUITests still run only on a laptop. See docs/launch-checklist.md §F."
          fi

      - name: Install Supabase CLI
        if: steps.cfg.outputs.configured == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      # Same command the laptop uses, aimed at the CI project: drops and
      # recreates the schema, applies every migration, loads the seed.
      - name: Reset the CI project to the seed
        if: steps.cfg.outputs.configured == 'true'
        env:
          DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
        run: supabase db reset --db-url "$DB_URL" --yes

      - name: Generate Xcode project
        if: steps.cfg.outputs.configured == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        if: steps.cfg.outputs.configured == 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) for x in d[k] if "iPhone" in x["name"]))')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # TEST_RUNNER_ variables reach the test runner as FXE_SUPABASE_*, and
      # setUp forwards them into the app's launch environment. One retry
      # absorbs the two known simulator flakes (first tap on the Profile tab,
      # sign-in timing after a cold start), both in docs/backlog.md.
      - name: XCUITests
        if: steps.cfg.outputs.configured == 'true'
        env:
          TEST_RUNNER_FXE_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL }}
          TEST_RUNNER_FXE_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
        run: |
          xcodebuild -project FXETennis.xcodeproj -scheme FXETennis \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:FXETennisUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath /tmp/ui.xcresult test

      - name: Keep the result bundle on failure
        if: failure() && steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcuitest-results
          path: /tmp/ui.xcresult
          if-no-files-found: ignore

  doc-paths:
    name: Docs are consistent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every repo path a doc names exists
        run: bash scripts/check-doc-paths.sh
      # Counts match the repo, decisions are indexed, every Tara question has
      # a status, and the human audit is not overdue (warning at 21 days,
      # failure at 45). 2026-09-13.
      - name: Counts, index, question statuses, audit age
        run: bash scripts/check-doc-claims.sh

  copy-gate:
    name: No unapproved copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check user-visible strings against the approved snapshot
        run: bash scripts/check-copy.sh

  # Credentials must never reach this repo. CLAUDE.md tells you to put the
  # hosted Postgres password in .env.local, and until 2026-08-13 that file was
  # not actually gitignored. The rule now has a machine behind it.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed secrets
        run: |
          FAIL=0

          # Any .env that is not the committed template.
          if git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' | grep -q .; then
            echo "::error::A .env file is tracked by git:"
            git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$'
            FAIL=1
          fi

          # Supabase secret keys and service-role JWTs. The `sb_publishable_`
          # keys in SupabaseClient.swift are SAFE and expected: they are the
          # anon keys, designed to sit in a client binary. It is the secret and
          # service_role variants that must never appear.
          if git grep -nE 'sb_secret_|service_role.{0,40}eyJ|SUPABASE_SERVICE_ROLE_KEY *= *["'"'"'][^"'"'"']' -- \
               ':!*.md' ':!.github/workflows/*' | grep -q .; then
            echo "::error::Possible service-role key committed:"
            git grep -nE 'sb_secret_|service_role.{0,40}eyJ' -- ':!*.md' ':!.github/workflows/*'
            FAIL=1
          fi

          # Personal identifiers. Tara sent her SSN and bank details in a
          # message on 2026-09-16 and the prompt-log hook copied them into a
          # tracked file before it learned to redact. Docs are scanned too.
          if git grep -nE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b|(?i)routing number[ :#]*[0-9]{6,}' -- ':!.github/workflows/*' | grep -q .; then
            echo "::error::Something shaped like a Social Security or routing number is tracked:"
            git grep -nE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b' -- ':!.github/workflows/*' | cut -c1-80
            FAIL=1
          fi

          # A password assigned a real value in a tracked file.
          if git grep -nE '(PASSWORD|password) *= *["'"'"'][^"'"'"']{6,}' -- \
               ':!*.md' ':!tests/*' ':!supabase/seed.sql' ':!.github/workflows/*' | grep -q .; then
            echo "::error::Possible hard-coded password:"
            git grep -nE '(PASSWORD|password) *= *["'"'"'][^"'"'"']{6,}' -- \
              ':!*.md' ':!tests/*' ':!supabase/seed.sql' ':!.github/workflows/*'
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] && echo "No secrets found." || exit 1

  # A migration that has been applied to the hosted database can never be
  # edited in place, only superseded. This catches the most common way that
  # rule gets broken by accident.
  hosted-smoke:
    name: Hosted is closed to a signed-out caller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Read-only, 48 requests with the publishable key that ships in the app.
      # Asks production the probe suite's grant question: every table, view,
      # RPC and edge function answers a signed-out caller with 401/403/404.
      - name: Signed-out smoke against the hosted project
        run: bash scripts/hosted-smoke.sh

  migration-immutability:
    name: No edits to existing migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a committed migration was modified
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=M "$BASE"...HEAD -- supabase/migrations/ || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::These migrations were modified rather than superseded:"
            echo "$CHANGED"
            echo ""
            echo "A migration that may already be applied to the hosted database"
            echo "must not be edited. Add a new migration that changes what you"
            echo "need instead."
            exit 1
          fi
          echo "No existing migrations were modified."
