<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FXE Tennis Court Sheet</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  /* A court sheet to print, in place of the handwritten one (decision 0027
     §3). One clinic's You're In! players by court, each with a rating. Layout
     only; colours come from tokens.css, and the printout is black on white. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fxe-surface); color: var(--fxe-text-primary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
  .bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
    border: 1px solid var(--fxe-navy); background: var(--fxe-navy); color: var(--fxe-text-on-navy);
    padding: 10px 18px; min-height: 44px;
  }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 28px; margin: 0; }
  .when { color: var(--fxe-text-secondary); margin: 4px 0 20px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px;
          border-radius: 999px; color:#992E22; background:#F6DED9; vertical-align: middle; }
  .court { border: 1px solid var(--fxe-hairline); border-radius: 12px; padding: 12px 16px;
           margin-bottom: 12px; background: var(--fxe-surface-raised); break-inside: avoid; }
  /* The body face: the display face's old-style 1 read as "ı" on "Court 1", and its web font has no lining figures (2026-09-29). */
  .court h2 { font-size: 18px; margin: 0 0 6px; font-family: var(--fxe-font-body); font-weight: 700; }
  .court ol { list-style: none; margin: 0; padding: 0; }
  .court li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
              border-top: 1px solid var(--fxe-hairline); font-size: 17px; }
  .court li:first-child { border-top: none; }
  .rating { color: var(--fxe-text-secondary); font-variant-numeric: tabular-nums; }
  .msg { color: var(--fxe-text-secondary); }
  .msg a { color: inherit; }
  @media print {
    .bar { display: none; }
    body { background: #fff; color: #000; }
    main { max-width: none; padding: 0; }
    .when, .rating { color: #000; }
    .court { background: #fff; border-color: #999; }
    .court li { border-top-color: #ccc; }
  }
</style>
</head>
<body>
<main>
  <div class="bar"><button id="print" type="button">Print</button></div>
  <h1 id="name"></h1>
  <p class="when" id="when"></p>
  <p class="msg" id="msg"></p>
  <div id="courts"></div>
</main>

<script type="module">
import { createClient } from "./vendor/supabase-js.js";
import { CONFIG } from "./config.js";

// The admin page's own client and session (same origin, same storage key), so
// opening this from a clinic card needs no second sign-in. The reads are the
// ones the roster already makes, and every one of them is admin-only in
// Postgres (clinics_admin and registrations_admin are `where is_admin()`):
// a member who opens this address reads nothing, and the page says so.
const sb = createClient(CONFIG.url, CONFIG.key, { auth: { flowType: "implicit" } });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const NY = "America/New_York";
const day = (iso) => new Date(iso).toLocaleDateString(undefined, { timeZone: NY, weekday: "long", month: "short", day: "numeric" });
const time = (iso) => new Date(iso).toLocaleTimeString(undefined, { timeZone: NY, hour: "numeric", minute: "2-digit" });
// The phone's rating label (NTRPRating.label): one decimal, and 5.0 is "5.0+".
const rating = (r) => r == null ? "—" : Number(r) >= 5 ? "5.0+" : Number(r).toFixed(1);

$("print").addEventListener("click", () => window.print());

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    $("msg").innerHTML = `<a href="index.html">Sign in on the admin page first.</a>`;
    return;
  }
  const id = new URLSearchParams(location.search).get("clinic") || "";
  // Not a clinic id at all: say so without asking the server.
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
    $("msg").textContent = "Couldn't load this clinic.";
    return;
  }
  const [{ data: clinic, error: e1 }, { data: regs, error: e2 }] = await Promise.all([
    sb.from("clinics_admin").select("id,name,starts_at,ends_at,status").eq("id", id).maybeSingle(),
    sb.from("registrations_admin").select("id,player_id,court_number").eq("clinic_id", id).eq("status", "in").order("id"),
  ]);
  if (e1 || e2 || !clinic) { $("msg").textContent = "Couldn't load this clinic."; return; }
  const ids = [...new Set((regs || []).map(r => r.player_id))];
  const { data: players, error: e3 } = ids.length
    ? await sb.from("players").select("id,first_name,last_name,adult_rating").in("id", ids)
    : { data: [], error: null };
  if (e3) { $("msg").textContent = "Couldn't load this clinic."; return; }

  document.title = `${clinic.name} Court Sheet`;
  $("name").innerHTML = esc(clinic.name) + (clinic.status === "canceled" ? ` <span class="chip">Canceled</span>` : "");
  $("when").textContent = `${day(clinic.starts_at)}, ${time(clinic.starts_at)} to ${time(clinic.ends_at)}`;

  const byId = Object.fromEntries((players || []).map(p => [p.id, p]));
  const people = (regs || []).map(r => {
    const p = byId[r.player_id];
    return { court: r.court_number, name: p ? `${p.first_name} ${p.last_name}` : "Unknown player", rating: p ? p.adult_rating : null };
  });
  if (!people.length) { $("msg").textContent = "Nobody is in yet."; return; }

  // Court 1, Court 2, ... in order, then everyone without a court, each group
  // by name: the order the phone's roster reads in.
  const courts = [...new Set(people.filter(x => x.court != null).map(x => x.court))].sort((a, b) => a - b);
  const groups = courts.map(n => ({ title: `Court ${n}`, rows: people.filter(x => x.court === n) }));
  const none = people.filter(x => x.court == null);
  if (none.length) groups.push({ title: "No court yet", rows: none });
  $("courts").innerHTML = groups.map(g => `<section class="court" data-court-group="${esc(g.title)}">
      <h2>${esc(g.title)}</h2>
      <ol>${g.rows.sort((a, b) => a.name.localeCompare(b.name)).map(x =>
        `<li><span class="player">${esc(x.name)}</span><span class="rating">${esc(rating(x.rating))}</span></li>`).join("")}</ol>
    </section>`).join("");
}

load().catch(() => { $("msg").textContent = "Couldn't load this clinic."; });
</script>
</body>
</html>
