<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page can carry a reset token; send no Referer anywhere (decision 0017). -->
<meta name="referrer" content="no-referrer">
<title>FXE Tennis · Reset password</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  *{box-sizing:border-box} body{margin:0;background:var(--fxe-surface);color:var(--fxe-text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
  .card{max-width:380px;margin:12vh auto;background:var(--fxe-surface-raised);border:1px solid var(--fxe-hairline);
    border-radius:14px;padding:20px}
  label{display:block;font-size:14px;color:var(--fxe-text-secondary);margin:10px 0 4px}
  input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--fxe-border);min-height:44px}
  button{font:inherit;font-weight:600;width:100%;margin-top:14px;min-height:44px;border-radius:10px;border:none;
    background:var(--fxe-navy);color:var(--fxe-text-on-navy);cursor:pointer}
  .err{color:#992E22;margin-top:10px} .ok{color:#2C5A3E;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1 style="margin:0 0 4px;font-size:20px">Choose a new password</h1>
  <p id="intro" style="color:var(--fxe-text-secondary);margin:0">Checking your reset link…</p>
  <form id="f" hidden>
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Type it again</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="go">Save password</button>
  </form>
  <div id="msg"></div>
</div>
<script type="module">
// Finishes a password reset. A link lands here in one of two shapes:
//
//   #token_hash=...&type=recovery   Tara's reset link (admin-reset-link,
//        decision 0017), and the reset email once its template uses the
//        token hash. Nothing happens until this page calls verifyOtp, so a
//        mail scanner or a link preview that fetches the URL cannot use up
//        the one-time token before the member taps it (Volee's lesson). It
//        rides in the fragment, which no browser sends in any request, so it
//        never reaches a server log either.
//   #access_token=...&type=recovery  the email's default link: GoTrue has
//        already verified the token on its own server and redirects here;
//        supabase-js reads the session out of the hash on load.
//
// The member's session lives in memory only (persistSession false, its own
// storage key): the admin site shares this origin, and a stored session
// would outlive the page, or replace Tara's own if she opened a link herself
// (sql-auditor, 2026-09-27). implicit flow, never PKCE: a reset started on
// the phone must finish here, and PKCE ties the code to the device that asked.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { CONFIG } from "./config.js";
const sb = createClient(CONFIG.url, CONFIG.key, {
  auth: { flowType: "implicit", persistSession: false, autoRefreshToken: false, storageKey: "fxe-reset" },
});
const $ = id => document.getElementById(id);

const ready = () => {
  $("intro").textContent = "Pick something you'll remember. At least 8 characters.";
  $("f").hidden = false;
};
const expired = () => {
  $("f").hidden = true;
  $("intro").textContent = "This link has expired or was already used. Go back and request a new one.";
};

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token_hash")) {
  const { error } = await sb.auth.verifyOtp({ token_hash: hash.get("token_hash"), type: "recovery" });
  // The token is spent now; take it out of the address bar.
  history.replaceState(null, "", location.pathname);
  if (error) expired(); else ready();
} else if (hash.get("error_code")) {
  expired();
} else {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" || session) ready();
  });
  setTimeout(() => { if ($("f").hidden) expired(); }, 4000);
}

$("f").onsubmit = async (e) => {
  e.preventDefault();
  if ($("p1").value !== $("p2").value) { $("msg").innerHTML = '<div class="err">Those don’t match.</div>'; return; }
  $("go").disabled = true;
  const { error } = await sb.auth.updateUser({ password: $("p1").value });
  $("go").disabled = false;
  $("msg").innerHTML = error
    ? '<div class="err">That didn’t save. Try again.</div>'
    : '<div class="ok">Saved. You can sign in with it now, on your phone or here.</div>';
  if (error) return;
  $("f").hidden = true;
  // Sign the account out everywhere, this page included: a session opened
  // from a link, by whoever held it, ends when the member chooses a password.
  // Their phone asks for the new password once (decision 0017).
  await sb.auth.signOut({ scope: "global" });
};
</script>
</body>
</html>
